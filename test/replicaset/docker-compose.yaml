# A 3-node replica set for integration tests: one primary, two secondaries.
#
# All three mongod processes share the network namespace of mongo1 and listen
# on ports 27017, 27018 and 27019. Members advertise 127.0.0.1:<port>, which
# resolves to the right process both inside the shared namespace and on the
# host through the published ports. This works the same on Docker Desktop and
# on Linux.
#
#   docker compose -f test/replicaset/docker-compose.yaml up -d --wait
#   export MIGRUNE_TEST_URI='mongodb://127.0.0.1:27017,127.0.0.1:27018,127.0.0.1:27019/?replicaSet=rs0'
#
# MONGO_IMAGE selects the MongoDB image (default mongo:9), to test another
# supported major version:
#
#   MONGO_IMAGE=mongo:7.0 docker compose -f test/replicaset/docker-compose.yaml up -d --wait
name: migrune-replicaset

x-mongod: &mongod
  image: ${MONGO_IMAGE:-mongo:9}
  tmpfs:
    - /data/db

services:
  mongo1:
    <<: *mongod
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
      - "127.0.0.1:27018:27018"
      - "127.0.0.1:27019:27019"
    # Initiates the replica set on first run, then reports healthy once this
    # node is primary. `docker compose up --wait` blocks until then.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --port=27017
        - --quiet
        - --eval
        - |
          try { rs.status() } catch (e) {
            rs.initiate({ _id: "rs0", members: [
              { _id: 0, host: "127.0.0.1:27017", priority: 2 },
              { _id: 1, host: "127.0.0.1:27018" },
              { _id: 2, host: "127.0.0.1:27019" },
            ] })
          }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 10s
      start_period: 60s
      start_interval: 1s
      timeout: 10s
      retries: 3

  mongo2:
    <<: *mongod
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    network_mode: service:mongo1

  mongo3:
    <<: *mongod
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    network_mode: service:mongo1
