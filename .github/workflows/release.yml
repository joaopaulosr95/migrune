name: Release

on:
  push:
    branches: [main]

# Each job asks for only what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # Cuts the version: the tag and the GitHub release. It can't push images.
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: this job can write to the repository.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # semantic-release and its plugins, at the versions in
      # .github/release/package-lock.json, without install scripts.
      - name: Install semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - id: semrel
        name: Release
        run: node .github/release/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the CI-tested commit and attests both images before tagging them.
  image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read # checkout
      packages: write
      id-token: write # to sign the provenance attestations
      attestations: write # to store them
    env:
      IMAGE: ghcr.io/joaopaulosr95/migrune
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check the release version
        run: |
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release version, such as 1.2.3."
            exit 1
          fi
          {
            echo "MAJOR=${BASH_REMATCH[1]}"
            echo "MINOR=${BASH_REMATCH[2]}"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: default
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      - id: debug
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: debug
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      # GitHub build-provenance attestations of each image index, which
      # gh attestation verify checks (docs/running.md, "Get the binary").
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.default.outputs.digest }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.debug.outputs.digest }}

      - name: Verify both image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_DIGEST: ${{ steps.default.outputs.digest }}
          DEBUG_DIGEST: ${{ steps.debug.outputs.digest }}
        run: |
          for digest in "$DEFAULT_DIGEST" "$DEBUG_DIGEST"; do
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done

      - name: Publish the release tags
        env:
          DEFAULT_DIGEST: ${{ steps.default.outputs.digest }}
          DEBUG_DIGEST: ${{ steps.debug.outputs.digest }}
        run: |
          # A retry keeps the original commit. Recheck the tag before moving aliases.
          tag="v$VERSION"
          refs=$(git ls-remote --tags origin 'v*')
          latest=$(awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ {
            sub(/^refs\/tags\//, "", $2); print $2
          }' <<< "$refs" | sort -V | tail -n 1)
          tagged_commit=$(awk -v ref="refs/tags/$tag" '
            $2 == ref { tag = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print (peeled == "" ? tag : peeled) }
          ' <<< "$refs")
          if [[ "$tag" != "$latest" || "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag must be the latest release tag and point to $GITHUB_SHA."
            exit 1
          fi
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR.$MINOR" -t "$IMAGE:$MAJOR" -t "$IMAGE:latest" \
            "$IMAGE@$DEFAULT_DIGEST"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION-debug" -t "$IMAGE:$MAJOR.$MINOR-debug" -t "$IMAGE:$MAJOR-debug" -t "$IMAGE:debug" \
            "$IMAGE@$DEBUG_DIGEST"
