name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: semrel
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/github@12.0.10
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.semrel.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.semrel.outputs.new_release_published == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.semrel.outputs.new_release_published == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          IMAGE: ghcr.io/joaopaulosr95/migrune
          MAJOR: ${{ steps.semrel.outputs.new_release_major_version }}
          MINOR: ${{ steps.semrel.outputs.new_release_minor_version }}
          PATCH: ${{ steps.semrel.outputs.new_release_patch_version }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.semrel.outputs.new_release_version }}
          tags: |
            ${{ env.IMAGE }}:${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}
            ${{ env.IMAGE }}:${{ env.MAJOR }}.${{ env.MINOR }}
            ${{ env.IMAGE }}:${{ env.MAJOR }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.semrel.outputs.new_release_version }}
            org.opencontainers.image.licenses=MIT
